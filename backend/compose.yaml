name: optimal-portfolio

services:
  postgres:
    image: postgres:18-alpine
    container_name: optimal-portfolio-postgres
    environment:
      POSTGRES_DB: optimal_portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d optimal_portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data: