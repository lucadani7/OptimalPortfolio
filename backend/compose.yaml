name: optimal-portfolio

services:
  postgres:
    image: postgres:18-alpine
    container_name: optimal-portfolio-postgres
    environment:
      POSTGRES_DB: optimal_portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d optimal_portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: optimal-portfolio-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: portfolio
      RABBITMQ_DEFAULT_PASS: portfolio
    ports:
      - "5672:5672"
      # Management UI: http://localhost:15672
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  rabbitmq-data: