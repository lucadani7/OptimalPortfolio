spring:
  docker:
    compose:
      lifecycle-management: start-only
      file: backend/compose.yaml
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    com.lucadani: debug

management:
  endpoint:
    health:
      show-details: always
  health:
    rabbit:
      enabled: false

jobrunr:
  dashboard:
    enabled: true
    port: 8001