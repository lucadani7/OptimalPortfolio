spring:
  docker:
    compose:
      lifecycle-management: start-only
      file: backend/compose.yaml
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    com.lucadani: debug

management:
  endpoint:
    health:
      show-details: always

app:
  jobs:
    consumer:
      # In development the API runs jobs too, so a separate worker is optional
      enabled: true

jobrunr:
  dashboard:
    enabled: true
    port: 8001