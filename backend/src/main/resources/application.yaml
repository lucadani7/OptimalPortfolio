spring:
  application:
    name: optimal-portfolio
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  cache:
    cache-names: statistics
    caffeine:
      spec: maximumSize=200,expireAfterWrite=1h
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    error:
      include-stacktrace: never
  rabbitmq:
    listener:
      simple:
        # One job at a time per consumer thread, two threads per instance
        prefetch: 1
        concurrency: 2
        # A message that keeps failing goes to the dead-letter queue instead of coming back forever
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jobrunr:
  background-job-server:
    enabled: true
  dashboard:
    enabled: false

app:
  market-data:
    # simulated: continues the price history with simulated closes; tiingo: real end-of-day prices
    provider: simulated
    # 02:00 Tuesday to Saturday: the evening after each US trading day, once end-of-day prices are published
    import-cron: "0 2 * * TUE-SAT"
    zone-id: Europe/Bucharest
    tiingo:
      # Free key from tiingo.com (account settings). Read from the environment, never committed.
      api-key: ${TIINGO_API_KEY:}
      base-url: https://api.tiingo.com
  jobs:
    # rabbit: jobs go through RabbitMQ to whichever instance consumes them; local: run in this instance
    dispatcher: rabbit
    consumer:
      # Whether this instance runs jobs from the queue. The worker profile turns it on.
      enabled: false
