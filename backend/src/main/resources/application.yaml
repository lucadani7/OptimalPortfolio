spring:
  application:
    name: optimal-portfolio
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  cache:
    cache-names: statistics
    caffeine:
      spec: maximumSize=200,expireAfterWrite=1h
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    error:
      include-stacktrace: never

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jobrunr:
  background-job-server:
    enabled: true
  dashboard:
    enabled: false

app:
  market-data:
    # simulated: continues the price history with simulated closes (a real provider comes later)
    provider: simulated
    # Weekdays at 23:30, after the US markets close
    import-cron: "30 23 * * MON-FRI"
    zone-id: Europe/Bucharest
